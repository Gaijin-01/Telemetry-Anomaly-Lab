name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Compile
        run: python -m compileall -q src
      - name: Tests
        run: pytest -q --ignore=tests/test_pyod_adapters.py
      - name: Ordinary package install and CLI smoke
        run: |
          python -m venv /tmp/anomaly-lab-smoke
          /tmp/anomaly-lab-smoke/bin/python -m pip install .
          cd /tmp
          /tmp/anomaly-lab-smoke/bin/anomaly-lab --help

  pyod-adapters:
    name: PyOD Adapters (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package with PyOD extra
        run: python -m pip install -e '.[dev,pyod]'
      - name: Verify PyOD is installed
        run: python -c "import pyod; print('PyOD version:', pyod.__version__)"
      - name: Run PyOD adapter tests
        run: pytest -q tests/test_pyod_adapters.py
      - name: Verify adapters are importable from installed package
        run: |
          python -c "from anomaly_lab.detectors.pyod_adapters import fit_predict_ecod, fit_predict_lof, fit_predict_knn, ECODConfig, LOFConfig, KNNConfig; print('All PyOD adapters importable: OK')"

  pyod-version-matrix:
    name: PyOD ${{ matrix.pyod-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
        pyod-version: ['1.1.0', '2.0.0']
        include:
          - python-version: '3.12'
            pyod-version: 'current'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install PyOD ${{ matrix.pyod-version }}
        run: |
          if [ "${{ matrix.pyod-version }}" = "current" ]; then
            python -m pip install -e '.[dev,pyod]'
          else
            python -m pip install "pyod==${{ matrix.pyod-version }}" "scikit-learn<1.6" "pyod>=1.1" -e '.[dev]'
          fi
      - name: Run PyOD adapter tests against pyod ${{ matrix.pyod-version }}
        run: pytest -q tests/test_pyod_adapters.py

  hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build artifact scan
        run: |
          echo "=== Tracked build artifacts ==="
          ARTIFACTS=$(git ls-files | grep -E '(\.whl$|/dist/|/build/|\.egg-info/|\.egg$|/htmlcov/)' || true)
          if [ -n "$ARTIFACTS" ]; then echo "FAIL: $ARTIFACTS"; exit 1; else echo "PASS"; fi
      - name: Cache artifact scan
        run: |
          echo "=== Tracked cache artifacts ==="
          CACHE=$(git ls-files | grep -E '(\.ruff_cache|\.mypy_cache|\.pytest_cache|__pycache__|\.hypothesis/)' || true)
          if [ -n "$CACHE" ]; then echo "FAIL: $CACHE"; exit 1; else echo "PASS"; fi
      - name: Machine-specific path scan
        run: |
          echo "=== Machine-specific paths ==="
          for pattern in "/mnt/c/Users" "/home/sefi" "C:\\\\Users" "\\\\DESKTO" "/tmp/anomaly-lab" "/tmp/ci_"; do
            FOUND=$(git ls-files | grep -F "$pattern" || true)
            if [ -n "$FOUND" ]; then echo "FAIL: $pattern in $FOUND"; exit 1; fi
          done
          echo "PASS"
      - name: Credential pattern scan
        run: |
          echo "=== Credential patterns ==="
          for pattern in \
            "ghp_[A-Za-z0-9]\{36\}" \
            "github_pat_[A-Za-z0-9_\-]\{70\}" \
            "xox[baprs]-[A-Za-z0-9\-]\{48\}" \
            "Bearer[[:space:]]\+[A-Za-z0-9_\-\.]\{20\}" \
            "GITHUB_TOKEN[[:space:]]*=" \
            "HuggingFace[[:space:]]*:"; do
            FOUND=$(git ls-files | grep -vF '.github/workflows/ci.yml' | xargs grep -lE "$pattern" 2>/dev/null || true)
            if [ -n "$FOUND" ]; then echo "FAIL: credential in $FOUND"; exit 1; fi
          done
          echo "PASS"
      - name: Agent/workbench marker scan
        run: |
          echo "=== Agent/workbench markers ==="
          for pattern in "@@agent" "@@hermes" "HERMES_RUNTIME" "HANDOFF_CONTEXT" "DELEG_BLOB" "WORKTREE_METADATA" "INTERNAL_MARKER"; do
            FOUND=$(git ls-files | grep -vF '.github/workflows/ci.yml' | xargs grep -lE "$pattern" 2>/dev/null || true)
            if [ -n "$FOUND" ]; then echo "FAIL: agent marker in $FOUND"; exit 1; fi
          done
          echo "PASS"
      - name: Hardcoded user-path scan (source only)
        run: |
          echo "=== Hardcoded user paths in source ==="
          SKIP_FILE=".github/workflows/ci.yml"
          SKIP_PAT="\.github/scripts/"
          for pattern in "/home/sefi" "/Users/" "/mnt/c/Users"; do
            FOUND=$(git ls-files | grep -vE '\.(gitignore|gitattributes|md|txt)$' | grep -vF "$SKIP_FILE" | grep -vE "\.github/scripts/" | xargs grep -lF "$pattern" 2>/dev/null || true)
            if [ -n "$FOUND" ]; then echo "FAIL: hardcoded path $pattern in $FOUND"; exit 1; fi
          done
          echo "PASS"
