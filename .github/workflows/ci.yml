name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Compile
        run: python -m compileall -q src
      - name: Tests
        run: pytest -q
      - name: Ordinary package install and CLI smoke
        run: |
          python -m venv /tmp/anomaly-lab-smoke
          /tmp/anomaly-lab-smoke/bin/python -m pip install .
          cd /tmp
          /tmp/anomaly-lab-smoke/bin/anomaly-lab --help
