# Scenario: insufficient data — too few rows for reliable estimation
# Robust zscore requires >= 3 samples.

name = "rz_insufficient_data"
type = "analyze"
detector = "robust-zscore"
features = ["x"]
fixture = "insufficient_data.csv"

# With n=5, this should still be above the min_samples=3 threshold
# but may produce INCONCLUSIVE due to MAD being unreliable with few points
expected_evidence_class = "INCONCLUSIVE"
expected_confidence_min = 0.0
expected_confidence_max = 0.5
expected_detector = "robust-zscore"
anomaly_count_min = 0
anomaly_count_max = 5

required_evidence_fields = [
    "evidence_class",
    "detector",
]

tolerance = 1e-4
